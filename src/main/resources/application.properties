spring.application.name=openai

#platform.openai.com/settings/organization/billing/overview
spring.ai.openai.api-key=${OPENAI_API_KEY}

#spring.ai.model.chat=ollama
#spring.ai.ollama.chat.model=llama3.2:1b
#spring.ai.ollama.base-url=http://localhost:11434

#the below are for docker based ai model
#spring.ai.openai.chat.options.model=ai/gemma3
#spring.ai.openai.api-key=dummy
#spring.ai.openai.base-url=http://localhost:12434/engines

logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n
#logging.level.org.springframework.ai.chat.client.advisor=DEBUG

#spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.url=jdbc:h2:file:D:/chatmemory_folder/chatmemory;AUTO_SERVER=true
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

#spring.ai.chat.memory.repository.jdbc.initialize-schema=embedded
spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.ai.chat.memory.repository.jdbc.schema=classpath:schema/schema-h2db.sql

spring.docker.compose.stop.command=down
spring.ai.vectorstore.qdrant.initialize-schema=true
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=eazybytes